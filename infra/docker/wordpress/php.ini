; ReserveChain.io — PHP configuration
; Secure uploads, sane limits, no information disclosure.

; --- Error handling: never leak internals into a response --------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Uploads: certificates, assay reports, inspection photographs ------------
file_uploads = On
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 20
max_execution_time = 120
max_input_vars = 3000
memory_limit = 512M

; --- Session / cookie hardening ----------------------------------------------
session.cookie_httponly = 1
session.cookie_secure = 0
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; --- Disable functions the platform never needs ------------------------------
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; --- Do not advertise the PHP version ----------------------------------------
expose_php = Off

date.timezone = UTC

; --- Mail --------------------------------------------------------------------
sendmail_path = "/usr/bin/msmtp -t"

; --- Opcache -----------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
