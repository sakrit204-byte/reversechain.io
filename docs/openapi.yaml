                push_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /support:
    post:
      tags: [Account]
      operationId: createSupportTicket
      summary: In-app support request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                subject: { type: string, default: App support }
                topic: { type: string, default: general }
                message: { type: string, minLength: 10 }
      responses:
        '200': { $ref: '#/components/responses/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Message too short (live)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: rc_invalid, message: Please describe your request., data: { status: 422 } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/delete:
    post:
      tags: [Account]
      operationId: deleteAccount
      summary: Delete (or anonymise) the account — app-store and GDPR/FADP erasure
      description: |
        Accounts without compliance history are deleted. Accounts with KYC/KYB/AML/sanctions outcomes are anonymised
        and locked; only the minimum compliance record required by law is retained. All sessions are revoked.
        Staff accounts are never deleted through the API.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm]
              properties:
                password: { type: string, format: password }
                confirm: { type: string, const: DELETE }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  mode: { type: string, enum: [deleted, anonymised] }
                  message: { type: string }
              example: { ok: true, mode: deleted, message: Your account and personal data have been deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Staff account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: rc_delete_staff, message: Staff accounts are closed by an administrator., data: { status: 403 } }
        '422':
          description: Wrong password or confirmation word (live)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: rc_delete_confirm, message: Confirm with your password and the word DELETE., data: { status: 422 } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /por:
    get:
