      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples:
                live:
                  summary: Live demo participant (name/email redacted)
                  value:
                    id: 7
                    name: '<display name>'
                    email: '<email>'
                    country: CH
                    entity_type: individual
                    language: en
                    mfa_enabled: false
                    eligibility: { country: CH, entity_type: individual, jurisdiction: eligible, kyc: pending, kyb: not_applicable, aml: not_started, sanctions: not_started, overall: incomplete, note: Eligibility status does not confer any right to participate in any future offering. }
                    created_at: '2026-10-06T11:47:18+00:00'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update display name and/or language
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                language: { type: string, enum: [en, es, it] }
      responses:
        '200':
          description: Updated profile (same shape as GET /me)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/holdings:
    get:
      tags: [Account]
      operationId: getHoldings
      summary: Token holdings (gated module `wallet`; placeholder)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gated placeholder (live)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gated' }
              example: { enabled: false, reason: Not yet available — subject to written authorization and final approval., items: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/transactions:
    get:
      tags: [Account]
      operationId: getTransactions
      summary: Token transactions (gated module `wallet`; placeholder)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gated placeholder (live)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gated' }
              example: { enabled: false, reason: Not yet available — subject to written authorization and final approval., items: [] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/notifications:
    get:
      tags: [Account]
      operationId: getNotifications
      summary: Personal + broadcast notifications (newest first, latest 50)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/Notification' }
              examples:
                live:
                  value:
                    - { id: 39, title: Compliance status updated, body: 'Sanctions / PEP screening status: Approved.', category: compliance, created_at: '2026-10-06 14:59:26Z', read: true, broadcast: false }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/notifications/{id}/read:
    post:
      tags: [Account]
      operationId: markNotificationRead
      summary: Mark one personal notification as read (idempotent; broadcasts are not affected)
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/devices:
    post:
      tags: [Account]
      operationId: registerDevice
      summary: Register a push token (keeps the 5 most recent)
      security:
