# Staging / production application stack: WordPress + MySQL 8 (+ wp-cli tool container).
# One copy per environment on the server, each in its own directory and compose project:
#   ~/reservechain/production  ->  docker compose -p rc-production -f docker-compose.prod.yml --env-file .env up -d
#   ~/reservechain/staging     ->  docker compose -p rc-staging    -f docker-compose.prod.yml --env-file .env up -d
# Distinct project names give distinct volumes (rc-production_db_data, rc-staging_db_data, ...).
# HTTPS is terminated by the shared edge Caddy (docker-compose.edge.yml), which reaches WordPress on the
# external network "rc_edge" under the alias "wp-<RC_ENV>". No ports are published by this stack.
# Secrets live in .env (generated by deploy.sh, mode 600, never committed). See deploy/env/*.env.example.
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: reservechain
      MYSQL_USER: rc_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD missing in .env}
    command: ["--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=192M", "--performance-schema=OFF"]
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot"]
      interval: 10s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    restart: always
    depends_on: { db: { condition: service_healthy } }
    environment: &wpenv
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: reservechain
      WORDPRESS_DB_USER: rc_app
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: ""   # WP_DEBUG off (the image defines WP_DEBUG from this variable)
      # Salts come from .env so a restored database works with a rebuilt container (sessions, signed links).
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY:?run deploy.sh to generate salts}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY:?}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY:?}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY:?}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT:?}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT:?}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT:?}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT:?}
      # Read at runtime with getenv() so values containing quotes or $ cannot break wp-config.php.
      RC_HEALTH_TOKEN: ${RC_HEALTH_TOKEN:-}
      WORDPRESS_SMTP_HOST: ${WORDPRESS_SMTP_HOST:-}
      WORDPRESS_SMTP_PORT: ${WORDPRESS_SMTP_PORT:-587}
      WORDPRESS_SMTP_SECURE: ${WORDPRESS_SMTP_SECURE:-tls}
      WORDPRESS_SMTP_USER: ${WORDPRESS_SMTP_USER:-}
      WORDPRESS_SMTP_PASSWORD: ${WORDPRESS_SMTP_PASSWORD:-}
      WORDPRESS_SMTP_FROM: ${WORDPRESS_SMTP_FROM:-}
      WORDPRESS_SMTP_FROM_NAME: ${WORDPRESS_SMTP_FROM_NAME:-ReserveChain}
      WORDPRESS_CONFIG_EXTRA: |
        define('RC_ENV', '${RC_ENV:?RC_ENV missing in .env}');
        define('WP_ENVIRONMENT_TYPE', '${RC_ENV}');
        define('RC_TOKEN_SECRET', '${RC_TOKEN_SECRET:?RC_TOKEN_SECRET missing in .env}');
        define('RC_DEMO_PASSWORD', '${RC_DEMO_PASSWORD:-}');
        define('RC_HEALTH_TOKEN', (string) getenv('RC_HEALTH_TOKEN'));
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', ${RC_FORCE_SSL_ADMIN:-true});
        define('DISABLE_WP_CRON', true); // real cron runs `wp cron event run --due-now` every 5 min (installed by deploy.sh)
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    volumes:
      - wp_data:/var/www/html
      - ./app/wordpress/themes/reservechain:/var/www/html/wp-content/themes/reservechain:ro
      - ./app/wordpress/plugins/reservechain-core:/var/www/html/wp-content/plugins/reservechain-core:ro
      - ./mu-plugins/rc-smtp.php:/var/www/html/wp-content/mu-plugins/rc-smtp.php:ro
      - ./php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      default: {}
      edge:
        aliases: ["wp-${RC_ENV}"]

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on: [wordpress]
    environment: *wpenv
    volumes:
      - wp_data:/var/www/html
      - ./app/wordpress/themes/reservechain:/var/www/html/wp-content/themes/reservechain:ro
      - ./app/wordpress/plugins/reservechain-core:/var/www/html/wp-content/plugins/reservechain-core:ro
      - ./mu-plugins/rc-smtp.php:/var/www/html/wp-content/mu-plugins/rc-smtp.php:ro

volumes:
  db_data:
  wp_data:

networks:
  edge:
    name: ${RC_EDGE_NETWORK:-rc_edge}
    external: true
